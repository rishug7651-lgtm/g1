services:
  - type: web
    name: clickkdesi-backend
    runtime: node
    plan: free
    rootDir: Clickkdesi/backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: RAZORPAY_KEY
        sync: false
      - key: RAZORPAY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_API_TOKEN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: MAILERSEND_API_KEY
        sync: false
      - key: MAILERSEND_FROM_EMAIL
        sync: false
      - key: MAILERSEND_FROM_NAME
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GOOGLE_CLIENT_EMAIL
        sync: false
      - key: GOOGLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_PROJECT_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT
        sync: false
      - key: SHEET_RETRY_ENABLED
        value: true
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CORS_ORIGINS
        value: https://s4-zdqq.onrender.com
      - key: PUBLIC_FRONTEND_URL
        value: https://s4-zdqq.onrender.com
      - key: PUBLIC_BACKEND_URL
        value: https://s4-backend-uyvz.onrender.com

  - type: web
    name: clickkdesi-frontend
    runtime: static
    rootDir: Clickkdesi/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: Cache-Control
        value: public, max-age=300
    envVars:
      - key: VITE_API_BASE_URL
        value: https://s4-backend-uyvz.onrender.com/api
      - key: VITE_PUBLIC_BACKEND_URL
        value: https://s4-backend-uyvz.onrender.com
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_RAZORPAY_KEY
        sync: false
